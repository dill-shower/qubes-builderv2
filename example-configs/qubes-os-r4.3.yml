git:
  baseurl: https://github.com
  prefix: QubesOS/qubes-
  branch: release4.3
  maintainers:
    - '0064428F455451B3EBE78A7F063938BA42CFA724'
    - '274E12AB03F2FE293765FC06DA0434BC706E1FCF'

backend-vmm: xen
debug: true
verbose: true
qubes-release: r4.3

distributions:
  - host-fc43

components:
  - builder-rpm:
      packages: False
      branch: main
  - linux-utils
  - dracut
  - linux-kernel-latest:
      url: https://github.com/dill-shower/qubes-linux-kernel
      branch: main
      timeout: 21600
      # Применяем настройки для дистрибутива dom0 (host-fcrq)
      host-fc43:
        stages:
          - build:
              environment:
                # Количество параллельных потоков
                MAKEFLAGS: "-j$(nproc)"
                # Оптимизация строго под AMD Zen 3 (Ryzen 5900HX)
                KCFLAGS: "-march=znver3 -mtune=znver3 -O2"
                EXTRA_CFLAGS: "-march=znver3 -mtune=znver3 -O2"

executor:
  type: docker
  options:
    image: "qubes-builder-fedora:latest"
    clean: True
    cpus: "0.000"

stages:
  - fetch
  - prep
  - build
  - post
