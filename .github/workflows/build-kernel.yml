name: Build Custom Qubes Kernel (Zen 3)

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-kernel:
    name: "Build Kernel (host-fc41)"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Очистка диска через Rust (rm-rs)
        run: |
          echo "=== Установка rm-rs и очистка диска ==="
          cargo install rm-rs --quiet 2>/dev/null || true

          RM_BIN=$(which rm-rs || echo "$HOME/.cargo/bin/rm-rs")
          if [ -x "$RM_BIN" ]; then
            echo "Используется Rust rm-rs: $RM_BIN"
            sudo "$RM_BIN" -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          else
            echo "Fallback на стандартный rm"
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          fi

          sudo docker image prune -a -f > /dev/null 2>&1 || true
          df -h /

      - name: 2. Клонирование qubes-builderv2
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 3. Установка хостовых зависимостей и настройка окружения
        run: |
          echo "=== Установка зависимостей хоста ==="
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-pip git

          # УСТАНАВЛИВАЕМ ПИТОН-МОДУЛЬ DOCKER (то из-за чего падало в container.py!)
          pip3 install --no-cache-dir docker pathspec sh packaging jinja2 click pyyaml requests --break-system-packages 2>/dev/null || \
          pip3 install --no-cache-dir docker pathspec sh packaging jinja2 click pyyaml requests

          # Запуск и настройка прав Docker
          sudo systemctl start docker || sudo service docker start || true
          sudo usermod -aG docker $USER
          sudo chmod 666 /var/run/docker.sock || true

          # Подгрузка модуля loop для /dev/loop-control (требуется container.py)
          sudo modprobe loop || true

      - name: 4. Генерация эталонного builder.yml
        run: |
          echo "=== Создаем builder.yml с опцией git-run-inplace ==="
          cat << 'EOF' > builder.yml
          git:
            baseurl: https://github.com
            prefix: QubesOS/qubes-
            branch: release4.3
            maintainers:
              - '0064428F455451B3EBE78A7F063938BA42CFA724'
              - '274E12AB03F2FE293765FC06DA0434BC706E1FCF'

          # Клонирование репозиториев напрямую хостом
          git-run-inplace: true

          backend-vmm: xen
          debug: true
          verbose: true
          qubes-release: r4.3

          distributions:
            - host-fc41

          components:
            - builder-rpm:
                packages: False
                branch: main
            - linux-kernel-latest:
                url: https://github.com/dill-shower/qubes-linux-kernel
                branch: main
                verification-mode: insecure-skip-checking
                timeout: 21600

          executor:
            type: docker
            options:
              image: "qubes-builder-fedora:latest"
              clean: true

          stages:
            - fetch
            - prep
            - build
          EOF
          cat builder.yml

      - name: 5. Предварительные тесты окружения (Pre-flight checks)
        run: |
          echo "=== 1. Проверка доступности Docker демона ==="
          docker version
          docker info > /dev/null 2>&1 && echo "✓ Демон Docker активен и доступен" || (echo "CRITICAL: Docker daemon не отвечает!" && exit 1)

          echo "=== 2. Проверка импорта Python DockerClient (проверка фикса container.py) ==="
          python3 -c "
          from docker import DockerClient
          client = DockerClient()
          print('✓ Python-библиотека docker успешно подключилась к сокету:', client.version()['Version'])
          "

          echo "=== 3. Проверка loop-control ==="
          ls -la /dev/loop-control && echo "✓ /dev/loop-control готов"

      - name: 6. Сборка базового Docker-образа
        run: |
          echo "=== Генерация образа qubes-builder-fedora:latest ==="
          ./tools/generate-container-image.sh docker
          docker images | grep qubes-builder-fedora || (echo "CRITICAL: Образ не собрался!" && exit 1)

      - name: 7.1. Fetch (Загрузка исходников ядра)
        run: |
          echo "=== [STAGE: FETCH] ==="
          ./qb --verbose --debug -c linux-kernel-latest package fetch

      - name: 7.2. Prep (Подготовка Chroot, спека и генерация SRPM)
        run: |
          echo "=== [STAGE: PREP] ==="
          ./qb --verbose --debug -c linux-kernel-latest package prep

      - name: 7.3. Build (Компиляция ядра GCC под Zen 3 в Docker)
        run: |
          echo "=== [STAGE: BUILD] ==="
          ./qb --verbose --debug -c linux-kernel-latest package build

      # =========================================================================
      # ДИАГНОСТИКА ПРИ ОШИБКАХ
      # =========================================================================
      - name: 8. Диагностика и вывод логов при падении сборки
        if: failure()
        run: |
          echo "================================================================="
          echo "❌ СБОРКА УПАЛА! ВЫВОД ДИАГНОСТИЧЕСКОЙ ИНФОРМАЦИИ:"
          echo "================================================================="
          echo "--- Состояние диска и памяти: ---"
          df -h /
          free -m

          echo "--- Доступные файлы логов в artifacts/logs: ---"
          find artifacts/logs -type f || echo "Логи в artifacts/logs не созданы"

          echo "--- Вывод последних 80 строк из каждого лога: ---"
          for log in $(find artifacts/logs -type f -name "*.log"); do
            echo "=============================================================="
            echo ">>> Хвост лога: $log"
            echo "=============================================================="
            tail -n 80 "$log"
          done

      - name: 9. Выгрузка полных логов сборки при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: artifacts/logs/
          retention-days: 7

      # =========================================================================
      # СБОР И ВЫГРУЗКА РЕЗУЛЬТАТОВ (RPM)
      # =========================================================================
      - name: 10. Сбор готовых RPM и генерация отчета
        if: always()
        run: |
          mkdir -p output_rpms
          find artifacts/ -type f -name "*.rpm" -exec cp -v {} output_rpms/ \;

          echo "### 📦 Результаты сборки ядра" >> $GITHUB_STEP_SUMMARY
          if [ -d "output_rpms" ] && [ "$(ls -A output_rpms)" ]; then
            echo "| Файл RPM | Размер |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            for f in output_rpms/*.rpm; do
              size=$(ls -lh "$f" | awk '{print $5}')
              name=$(basename "$f")
              echo "| \`$name\` | $size |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "❌ RPM-пакеты не были собраны." >> $GITHUB_STEP_SUMMARY
          fi

      - name: 11. Загрузка готовых RPM в GitHub Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qubes-kernel-5900hx-rpm
          path: output_rpms/*.rpm
          retention-days: 14
          compression-level: 3
          if-no-files-found: error
