name: Build Custom Qubes Kernel (Zen 3)

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-kernel:
    name: "Build Kernel (host-fcrq)"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Очистка диска через Rust (rm-rs)
        run: |
          echo "=== Установка rm-rs и очистка диска ==="
          # Быстрая установка крошечного бинарника rm-rs
          cargo install rm-rs --quiet 2>/dev/null || true

          RM_BIN=$(which rm-rs || echo "$HOME/.cargo/bin/rm-rs")
          if [ -x "$RM_BIN" ]; then
            echo "Используется Rust rm-rs: $RM_BIN"
            sudo "$RM_BIN" -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          else
            echo "Fallback на стандартный rm"
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          fi

          sudo docker image prune -a -f > /dev/null 2>&1 || true
          df -h /

      - name: 2. Клонирование qubes-builderv2
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 3. Установка хостовых зависимостей и настройка окружения
        run: |
          echo "=== Установка пакетов хоста ==="
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            python3-pip python3-yaml python3-click python3-jinja2 python3-packaging \
            python3-pathspec python3-requests git docker.io

          pip3 install --no-cache-dir pathspec sh packaging jinja2 click pyyaml requests --break-system-packages 2>/dev/null || \
          pip3 install --no-cache-dir pathspec sh packaging jinja2 click pyyaml requests

          sudo usermod -aG docker $USER
          sudo chmod 666 /var/run/docker.sock || true

      - name: 4. Предварительные тесты окружения (Pre-flight checks)
        run: |
          echo "=== 1. Проверка доступности бинарников ==="
          which docker || (echo "CRITICAL: docker не найден в PATH!" && exit 1)
          which python3 || (echo "CRITICAL: python3 не найден в PATH!" && exit 1)
          which git || (echo "CRITICAL: git не найден в PATH!" && exit 1)

          echo "=== 2. Проверка работы Docker-демона ==="
          docker info > /dev/null 2>&1 && echo "✓ Docker работает и сокет доступен" || (echo "CRITICAL: Нет связи с демоном Docker!" && exit 1)

          echo "=== 3. Проверка Python-библиотек для ./qb ==="
          python3 -c "
          import pathspec, sh, yaml, click, jinja2, requests, packaging
          print('✓ Все требуемые Python библиотеки успешно импортированы')
          "

          echo "=== 4. Проверка конфига builder.yml ==="
          if [ -f builder.yml ]; then
            echo "✓ builder.yml найден"
          else
            echo "CRITICAL: Файл builder.yml отсутствует в корне репозитория!" && exit 1
          fi

      - name: 5. Сборка базового Docker-образа
        run: |
          echo "=== Генерация образа qubes-builder-fedora:latest ==="
          ./tools/generate-container-image.sh docker
          docker images | grep qubes-builder-fedora || (echo "CRITICAL: Образ не собрался!" && exit 1)

      - name: 6.1. Fetch (Загрузка исходников и сабмодулей)
        run: |
          echo "=== [STAGE: FETCH] ==="
          ./qb --verbose --debug -c linux-kernel-latest package fetch

      - name: 6.2. Prep (Подготовка Chroot, спека и генерация SRPM)
        run: |
          echo "=== [STAGE: PREP] ==="
          ./qb --verbose --debug -c linux-kernel-latest package prep

      - name: 6.3. Build (Компиляция ядра GCC под Zen 3)
        run: |
          echo "=== [STAGE: BUILD] ==="
          ./qb --verbose --debug -c linux-kernel-latest package build

      # =========================================================================
      # ДИАГНОСТИКА ПРИ ОШИБКАХ
      # =========================================================================
      - name: 7. Диагностика и вывод логов при падении сборки
        if: failure()
        run: |
          echo "================================================================="
          echo "❌ СБОРКА УПАЛА! ВЫВОД ДИАГНОСТИЧЕСКОЙ ИНФОРМАЦИИ:"
          echo "================================================================="
          echo "--- Состояние диска и памяти: ---"
          df -h /
          free -m

          echo "--- Доступные файлы логов в artifacts/logs: ---"
          find artifacts/logs -type f || echo "Логи в artifacts/logs не созданы"

          echo "--- Вывод последних 80 строк из каждого лога: ---"
          for log in $(find artifacts/logs -type f -name "*.log"); do
            echo "=============================================================="
            echo ">>> Хвост лога: $log"
            echo "=============================================================="
            tail -n 80 "$log"
          done

      - name: 8. Выгрузка полных логов сборки при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: artifacts/logs/
          retention-days: 7

      # =========================================================================
      # СБОР И ВЫГРУЗКА РЕЗУЛЬТАТОВ (RPM)
      # =========================================================================
      - name: 9. Сбор готовых RPM и генерация отчета
        if: always()
        run: |
          mkdir -p output_rpms
          find artifacts/ -type f -name "*.rpm" -exec cp -v {} output_rpms/ \;

          echo "### 📦 Результаты сборки ядра" >> $GITHUB_STEP_SUMMARY
          if [ -d "output_rpms" ] && [ "$(ls -A output_rpms)" ]; then
            echo "| Файл RPM | Размер |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            for f in output_rpms/*.rpm; do
              size=$(ls -lh "$f" | awk '{print $5}')
              name=$(basename "$f")
              echo "| \`$name\` | $size |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "❌ RPM-пакеты не были собраны." >> $GITHUB_STEP_SUMMARY
          fi

      - name: 10. Загрузка готовых RPM в GitHub Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qubes-kernel-5900hx-rpm
          path: output_rpms/*.rpm
          retention-days: 14
          compression-level: 3
          if-no-files-found: error
