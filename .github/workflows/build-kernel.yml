name: Build Custom Qubes Kernel (Zen 3)

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-kernel:
    name: "Build Kernel (host-fc41)"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Очистка диска через Rust (rm-rs)
        run: |
          echo "=== Установка rm-rs и очистка диска ==="
          cargo install rm-rs --quiet 2>/dev/null || true

          RM_BIN=$(which rm-rs || echo "$HOME/.cargo/bin/rm-rs")
          if [ -x "$RM_BIN" ]; then
            echo "Используется Rust rm-rs: $RM_BIN"
            sudo "$RM_BIN" -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          else
            echo "Fallback на стандартный rm"
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          fi

          sudo docker image prune -a -f > /dev/null 2>&1 || true
          df -h /

      - name: 2. Клонирование qubes-builderv2
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 3. Установка хостовых зависимостей и настройка окружения
        run: |
          echo "=== Установка зависимостей хоста ==="
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            python3-pip git gnupg curl xz-utils tar

          # Отключаем проверку владельца репозиториев на хосте
          git config --global --add safe.directory "*"

          # Установка Python-библиотек
          pip3 install --no-cache-dir docker podman pathspec sh packaging jinja2 click pyyaml requests --break-system-packages 2>/dev/null || \
          pip3 install --no-cache-dir docker podman pathspec sh packaging jinja2 click pyyaml requests

          # Удаляем несовместимый бинарник sq, если остался
          rm -f "$HOME/.cargo/bin/sq" /usr/local/bin/sq || true

          # Универсальный адаптер sq -> gpg
          sudo bash -c 'cat << "EOF" > /usr/local/bin/sq
          #!/usr/bin/env bash
          set -e
          if [[ "$1" == "toolbox" ]]; then shift; fi
          if [[ "$1" == "keyring" && "$2" == "merge" ]]; then
              shift 2
              out=""
              files=()
              while [[ $# -gt 0 ]]; do
                  case "$1" in
                      --output) out="$2"; shift 2 ;;
                      *) files+=("$1"); shift ;;
                  esac
              done
              cat "${files[@]}" > "$out"
              exit 0
          fi
          if [[ "$1" == "packet" && "$2" == "dearmor" ]] || [[ "$1" == "dearmor" ]]; then
              if [[ "$1" == "packet" ]]; then shift 2; else shift 1; fi
              out=""
              in=""
              while [[ $# -gt 0 ]]; do
                  case "$1" in
                      --output) out="$2"; shift 2 ;;
                      *) in="$1"; shift ;;
                  esac
              done
              gpg --batch --yes --dearmor --output "$out" "$in"
              exit 0
          fi
          exec gpg "$@"
          EOF'
          sudo chmod +x /usr/local/bin/sq

          # Запуск и настройка прав Docker
          sudo systemctl start docker || sudo service docker start || true
          sudo usermod -aG docker $USER
          sudo chmod 666 /var/run/docker.sock || true

          # Подгрузка модуля loop для /dev/loop-control
          sudo modprobe loop || true

      - name: 4. Генерация эталонного builder.yml
        run: |
          echo "=== Создаем builder.yml ==="
          cat << 'EOF' > builder.yml
          git:
            baseurl: https://github.com
            prefix: QubesOS/qubes-
            branch: release4.3
            maintainers:
              - '0064428F455451B3EBE78A7F063938BA42CFA724'
              - '274E12AB03F2FE293765FC06DA0434BC706E1FCF'

          git-run-inplace: true

          use-qubes-repo:
            version: '4.3'
            testing: true

          backend-vmm: xen
          debug: true
          verbose: true
          qubes-release: r4.3

          distributions:
            - host-fc41

          components:
            - builder-rpm:
                packages: False
                branch: main
            - linux-kernel-latest:
                url: https://github.com/dill-shower/qubes-linux-kernel
                branch: main
                verification-mode: insecure-skip-checking
                timeout: 21600

          executor:
            type: docker
            options:
              image: "qubes-builder-fedora:latest"
              clean: false
              clean-on-error: false

          stages:
            - fetch
            - prep
            - build
          EOF
          cat builder.yml

      - name: 5. Сборка и фикс прав PAM/sudo/Git в Docker-образе
        run: |
          echo "=== 1. Генерация образа qubes-builder-fedora:latest ==="
          ./tools/generate-container-image.sh docker
          docker images | grep qubes-builder-fedora || (echo "CRITICAL: Образ не собрался!" && exit 1)

          echo "=== 2. Фикс PAM, sudo и safe.directory внутри образа ==="
          CONTAINER_ID=$(docker run -d --privileged -u 0 qubes-builder-fedora:latest bash -c "
            passwd -d user || true
            usermod -U user || true
            echo 'user ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/99-user
            chmod 0440 /etc/sudoers.d/99-user
            sed -i '/pam_systemd_home.so/d' /etc/pam.d/* 2>/dev/null || true
            git config --system --add safe.directory '*' || true
            su - user -c \"git config --global --add safe.directory '*'\" || true
          ")
          docker wait "$CONTAINER_ID"
          docker commit "$CONTAINER_ID" qubes-builder-fedora:latest
          docker rm "$CONTAINER_ID"

          echo "=== 3. Проверка safe.directory внутри контейнера ==="
          docker run --rm qubes-builder-fedora:latest git config --system --get-all safe.directory

      - name: 6.1. Fetch (Загрузка исходников ядра и tar.xz)
        run: |
          echo "=== [STAGE: FETCH] ==="
          ./qb --verbose --debug -c linux-kernel-latest package fetch

      - name: 6.2. Prep (Подготовка Chroot, спека и генерация SRPM)
        run: |
          echo "=== [STAGE: PREP] ==="
          ./qb --verbose --debug -c linux-kernel-latest package prep

      - name: 6.3. Build (Компиляция ядра GCC под Zen 3 в Docker)
        run: |
          echo "=== [STAGE: BUILD] ==="
          ./qb --verbose --debug -c linux-kernel-latest package build

      # =========================================================================
      # ПОЛНАЯ ДИАГНОСТИКА ПРИ ОШИБКАХ
      # =========================================================================
      - name: 7. Диагностика и вывод логов сборки
        if: failure()
        run: |
          echo "================================================================="
          echo "❌ СБОРКА УПАЛА! ВЫВОД ДИАГНОСТИЧЕСКОЙ ИНФОРМАЦИИ:"
          echo "================================================================="
          df -h /
          free -m

          echo "--- 1. Попытка достать build.log из контейнеров Docker: ---"
          mkdir -p /tmp/extracted_logs
          for cid in $(docker ps -a -q); do
            docker cp "$cid:/builder/build/build.log" /tmp/extracted_logs/ 2>/dev/null || true
            docker cp "$cid:/builddir/build/BUILD/build.log" /tmp/extracted_logs/ 2>/dev/null || true
          done

          if [ -f /tmp/extracted_logs/build.log ]; then
            echo ">>> НАЙДЕН BUILD.LOG:"
            tail -n 150 /tmp/extracted_logs/build.log
          else
            echo "Логи на диске хоста:"
            find artifacts/ -type f \( -name "*.log" -o -name "build.log" -o -name "root.log" \) -exec echo ">>> Лог: {}" \; -exec tail -n 60 {} \;
          fi

      - name: 8. Выгрузка всех файлов логов и отчетов при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            /tmp/extracted_logs/*.log
            artifacts/**/*.log
            artifacts/**/build.log
            artifacts/**/root.log
          retention-days: 7

      # =========================================================================
      # СБОР И ВЫГРУЗКА ТОЛЬКО ГОТОВЫХ ЯДЕРНЫХ RPM (БЕЗ МУСОРА КЭША)
      # =========================================================================
      - name: 9. Сбор готовых RPM ядра и генерация отчета
        if: always()
        run: |
          mkdir -p output_rpms
          # Ищем ТОЛЬКО пакеты ядра в папке компонентов, исключая chroot кэш и src.rpm
          find artifacts/components/linux-kernel-latest/ -type f -name "kernel-latest-*.x86_64.rpm" -exec cp -v {} output_rpms/ \;

          echo "### 📦 Результаты сборки ядра (Zen 3)" >> $GITHUB_STEP_SUMMARY
          if [ -d "output_rpms" ] && [ "$(ls -A output_rpms)" ]; then
            echo "| Файл RPM | Размер |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            for f in output_rpms/*.rpm; do
              size=$(ls -lh "$f" | awk '{print $5}')
              name=$(basename "$f")
              echo "| \`$name\` | $size |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "❌ RPM-пакеты не были собраны." >> $GITHUB_STEP_SUMMARY
          fi

      - name: 10. Загрузка готовых RPM в GitHub Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qubes-kernel-rpm
          path: output_rpms/*.rpm
          retention-days: 14
          compression-level: 3
          if-no-files-found: error
